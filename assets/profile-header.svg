        <path d="M0 101 C38 96, 47 72, 81 76 S126 95, 164 61 S224 35, 259 54 S312 78, 348 37 S397 19, 426 24" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
