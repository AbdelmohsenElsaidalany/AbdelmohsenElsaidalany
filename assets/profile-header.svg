    <text x="104" y="250" fill="#58A6FF" font-size="16" font-weight="750" letter-spacing="1.6">SOFTWARE ENGINEER</text>
    <text x="80" y="299" fill="#C9D1D9" font-size="19">SaaS • Business Systems • Product Engineering</text>
    <text x="80" y="331" fill="#8B949E" font-size="15">Turning real workflows into reliable, easy-to-use products.</text>
    <g transform="translate(80 358)">
      <rect width="102" height="30" rx="8" fill="#161B22" stroke="#30363D"/><text x="51" y="20" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="700">POS / ERP</text>
      <rect x="112" width="76" height="30" rx="8" fill="#161B22" stroke="#30363D"/><text x="150" y="20" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="700">SAAS</text>
      <rect x="198" width="118" height="30" rx="8" fill="#161B22" stroke="#30363D"/><text x="257" y="20" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="700">AUTOMATION</text>
      <rect x="326" width="114" height="30" rx="8" fill="#161B22" stroke="#30363D"/><text x="383" y="20" text-anchor="middle" fill="#C9D1D9" font-size="12" font-weight="700">ARABIC RTL</text>
