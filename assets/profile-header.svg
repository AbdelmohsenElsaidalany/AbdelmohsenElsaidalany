        <g fill="#0D1117" stroke="#58A6FF" stroke-width="3"><circle cx="81" cy="76" r="5"/><circle cx="164" cy="61" r="5"/><circle cx="259" cy="54" r="5"/><circle cx="348" cy="37" r="5"/><circle cx="426" cy="24" r="5"/></g>
