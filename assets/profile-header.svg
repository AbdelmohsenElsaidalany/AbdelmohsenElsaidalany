<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Abdelmohsen Elsaidalany — animated software engineer profile</title>
  <desc id="desc">Premium animated dark hero showing Abdelmohsen as a software engineer building SaaS products, business systems, and Arabic-first experiences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.45" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#07111C"/>
      <animate attributeName="x1" values="0;0.18;0" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.76;1" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.48" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A111E" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop offset="0" stop-color="#2EA043" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2EA043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6E7681" stroke-width="0.7" opacity="0.13"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <clipPath id="terminalClip"><rect x="671" y="78" width="454" height="340" rx="20"/></clipPath>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .border-flow { stroke-dasharray: 18 12; animation: borderFlow 10s linear infinite; }
      .name-stroke { fill: none; stroke: url(#accent); stroke-width: 1.6; stroke-dasharray: 1050; stroke-dashoffset: 1050; animation: drawName 2.2s cubic-bezier(.65,0,.35,1) forwards; }
      .name-fill { opacity: 0; animation: nameFill .8s ease 1.45s forwards; }
      .status-dot { animation: statusPulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .cursor { animation: blink 1s steps(2,end) infinite; }
      .scan { animation: scan 5.5s linear infinite; }
      .graph { stroke-dasharray: 700; stroke-dashoffset: 700; animation: drawGraph 3.4s ease 1s forwards; }
      .graph-dot { animation: dotPulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .line-1 { opacity: 0; animation: terminalLine 12s ease infinite 0s; }
      .line-2 { opacity: 0; animation: terminalLine 12s ease infinite 1.2s; }
      .line-3 { opacity: 0; animation: terminalLine 12s ease infinite 2.4s; }
      .line-4 { opacity: 0; animation: terminalLine 12s ease infinite 3.6s; }
      .keyword { opacity: 0; }
      .kw-1 { animation: keywordCycle 16s ease-in-out infinite 0s; }
      .kw-2 { animation: keywordCycle 16s ease-in-out infinite 4s; }
      .kw-3 { animation: keywordCycle 16s ease-in-out infinite 8s; }
      .kw-4 { animation: keywordCycle 16s ease-in-out infinite 12s; }
      .float-a { animation: floatA 8s ease-in-out infinite; }
      .float-b { animation: floatB 10s ease-in-out infinite; }
      @keyframes borderFlow { to { stroke-dashoffset: -300; } }
      @keyframes drawName { to { stroke-dashoffset: 0; } }
      @keyframes nameFill { to { opacity: 1; } }
      @keyframes statusPulse { 0%,100% { opacity:.65; transform:scale(.78); } 50% { opacity:1; transform:scale(1.22); } }
      @keyframes blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
      @keyframes scan { from { transform:translateY(-90px); opacity:0; } 12% { opacity:.48; } 86% { opacity:.22; } to { transform:translateY(430px); opacity:0; } }
      @keyframes drawGraph { to { stroke-dashoffset:0; } }
      @keyframes dotPulse { 0%,100% { opacity:.55; transform:scale(.8); } 50% { opacity:1; transform:scale(1.28); } }
      @keyframes terminalLine { 0%,7% { opacity:0; transform:translateY(7px); } 12%,78% { opacity:1; transform:translateY(0); } 88%,100% { opacity:.15; } }
      @keyframes keywordCycle { 0%,4% { opacity:0; transform:translateY(7px); } 8%,20% { opacity:1; transform:translateY(0); } 24%,100% { opacity:0; transform:translateY(-7px); } }
      @keyframes floatA { 0%,100% { transform:translate(0,0); } 50% { transform:translate(18px,13px); } }
      @keyframes floatB { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-14px,-18px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .name-fill { opacity:1; } }
    </style>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <circle class="float-a" cx="1065" cy="60" r="250" fill="url(#blueGlow)"/>
  <circle class="float-b" cx="980" cy="500" r="230" fill="url(#greenGlow)"/>
  <rect x="2" y="2" width="1196" height="516" rx="26" fill="none" stroke="#303A4D" stroke-width="2"/>
  <rect class="border-flow" x="7" y="7" width="1186" height="506" rx="23" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.48"/>

  <g class="ui">
    <g transform="translate(72 65)">
      <circle class="status-dot" cx="7" cy="7" r="7" fill="#3FB950" filter="url(#softGlow)"/>
      <text x="29" y="12" fill="#8B9BB4" font-size="13" font-weight="700" letter-spacing="2.7">PRODUCT ENGINEER • SYSTEMS THINKER</text>
    </g>

    <text class="name-stroke" x="70" y="170" font-size="60" font-weight="850" letter-spacing="1.2">ABDELMOHSEN</text>
    <text class="name-stroke" x="70" y="239" font-size="60" font-weight="850" letter-spacing="1.2">ELSAIDALANY</text>
    <text class="name-fill" x="70" y="170" fill="#F4F7FB" font-size="60" font-weight="850" letter-spacing="1.2">ABDELMOHSEN</text>
    <text class="name-fill" x="70" y="239" fill="#F4F7FB" font-size="60" font-weight="850" letter-spacing="1.2">ELSAIDALANY</text>

    <rect x="72" y="270" width="360" height="42" rx="21" fill="#58A6FF" opacity="0.1" stroke="#58A6FF" stroke-opacity="0.45"/>
    <text x="96" y="297" fill="#76B7FF" font-size="14" font-weight="800" letter-spacing="1.55">SOFTWARE ENGINEER / PRODUCT BUILDER</text>

    <text x="72" y="350" fill="#CFD7E6" font-size="19">I turn complex operations into software people trust.</text>
    <text x="72" y="380" fill="#7E8DA6" font-size="15">Business logic • Data integrity • Arabic-first experiences • Reliable delivery</text>

    <text x="72" y="431" fill="#6E7E97" font-size="12" font-weight="700" letter-spacing="2">CURRENT FOCUS</text>
    <g class="mono" transform="translate(225 431)" font-size="15" font-weight="700">
      <text class="keyword kw-1" fill="#58A6FF">SAAS PRODUCTS_</text>
      <text class="keyword kw-2" fill="#A371F7">BUSINESS SYSTEMS_</text>
      <text class="keyword kw-3" fill="#3FB950">AUTOMATION WORKFLOWS_</text>
      <text class="keyword kw-4" fill="#F0883E">ARABIC-FIRST UX_</text>
    </g>

    <line x1="72" y1="470" x2="575" y2="470" stroke="#263248"/>
    <text x="72" y="494" fill="#73829A" font-size="12" letter-spacing="1.1">EGYPT</text>
    <circle cx="130" cy="490" r="2" fill="#3FB950"/>
    <text x="144" y="494" fill="#73829A" font-size="12" letter-spacing="1.1">EYAN BUSINESS SOLUTIONS</text>
    <circle cx="334" cy="490" r="2" fill="#58A6FF"/>
    <text x="348" y="494" fill="#73829A" font-size="12" letter-spacing="1.1">ARABIC-FIRST PRODUCTS</text>
  </g>

  <g class="mono" filter="url(#cardShadow)">
    <rect x="650" y="58" width="500" height="382" rx="22" fill="url(#glass)" stroke="#34435B"/>
    <rect x="651" y="59" width="498" height="44" rx="21" fill="#111B2A"/>
    <path d="M651 103H1149" stroke="#2A3850"/>
    <circle cx="677" cy="81" r="5" fill="#FF5F57"/>
    <circle cx="695" cy="81" r="5" fill="#FEBC2E"/>
    <circle cx="713" cy="81" r="5" fill="#28C840"/>
    <text x="744" y="85" fill="#7788A4" font-size="11" letter-spacing="1.4">product-system.sh</text>

    <g font-size="13">
      <text class="line-1" x="682" y="138" fill="#7EE787"><tspan fill="#58A6FF">$</tspan> discover --workflow real-world</text>
      <text class="line-2" x="682" y="169" fill="#C9D1D9"><tspan fill="#58A6FF">$</tspan> model --rules --source-of-truth</text>
      <text class="line-3" x="682" y="200" fill="#C9D1D9"><tspan fill="#58A6FF">$</tspan> build --frontend --backend --data</text>
      <text class="line-4" x="682" y="231" fill="#7EE787"><tspan fill="#58A6FF">✓</tspan> system ready for real operations</text>
      <rect class="cursor" x="975" y="218" width="8" height="16" rx="1" fill="#58A6FF"/>
    </g>

    <g transform="translate(682 262)">
      <text x="0" y="0" fill="#6E7E97" font-size="10" letter-spacing="1.6">DELIVERY SIGNAL</text>
      <line x1="0" y1="115" x2="418" y2="115" stroke="#2A3850"/>
      <line x1="0" y1="78" x2="418" y2="78" stroke="#26344A" opacity="0.72"/>
      <line x1="0" y1="41" x2="418" y2="41" stroke="#26344A" opacity="0.5"/>
      <path class="graph" d="M0 106 C35 103 52 83 84 87 S133 110 166 68 S219 45 250 63 S300 91 337 48 S385 24 418 30" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 106 C35 103 52 83 84 87 S133 110 166 68 S219 45 250 63 S300 91 337 48 S385 24 418 30 L418 115 L0 115 Z" fill="url(#accent)" opacity="0.075"/>
      <g fill="#0C1424" stroke="#58A6FF" stroke-width="2.5">
        <circle class="graph-dot" cx="84" cy="87" r="5"/>
        <circle class="graph-dot" cx="166" cy="68" r="5" style="animation-delay:.4s"/>
        <circle class="graph-dot" cx="250" cy="63" r="5" style="animation-delay:.8s"/>
        <circle class="graph-dot" cx="337" cy="48" r="5" style="animation-delay:1.2s"/>
        <circle class="graph-dot" cx="418" cy="30" r="5" style="animation-delay:1.6s"/>
      </g>
    </g>

    <g clip-path="url(#terminalClip)">
      <rect class="scan" x="651" y="70" width="498" height="72" fill="url(#accent)" opacity="0.11"/>
    </g>
  </g>
</svg>
