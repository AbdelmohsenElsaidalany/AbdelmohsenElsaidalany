    <text x="78" y="142" fill="url(#name)" font-size="51" font-weight="800" letter-spacing="1.4">ABDELMOHSEN</text>
    <text x="78" y="199" fill="url(#name)" font-size="51" font-weight="800" letter-spacing="1.4">ELSAIDALANY</text>
