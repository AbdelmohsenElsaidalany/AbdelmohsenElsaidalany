        <rect x="146" width="132" height="64" rx="10" fill="#161B22" stroke="#30363D"/><text x="160" y="23" fill="#8B949E" font-size="10" letter-spacing="1.2">EXPERIENCE</text><text x="160" y="47" fill="#3FB950" font-size="14" font-weight="700">MOBILE-FIRST</text>
        <rect x="292" width="134" height="64" rx="10" fill="#161B22" stroke="#30363D"/><text x="306" y="23" fill="#8B949E" font-size="10" letter-spacing="1.2">INTERFACE</text><text x="306" y="47" fill="#D2A8FF" font-size="14" font-weight="700">ARABIC RTL</text>
      </g>
