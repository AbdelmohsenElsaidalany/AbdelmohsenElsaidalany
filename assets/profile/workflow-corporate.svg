      <text x="18" y="63" fill="#EEF4F8" font-size="14" font-weight="700">Business Case</text>
      <text x="18" y="87" fill="#91A6B8" font-size="11">Value · scope · goals</text>
    </g>

    <g transform="translate(215 120)">
      <rect width="135" height="108" rx="16" fill="#0F2436" stroke="#3E5B73"/>
      <circle cx="26" cy="27" r="15" fill="#18344A" stroke="#6F879C"/>
      <text x="26" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">02</text>
      <text x="18" y="63" fill="#EEF4F8" font-size="14" font-weight="700">Discovery</text>
      <text x="18" y="87" fill="#91A6B8" font-size="11">Users · process · data</text>
