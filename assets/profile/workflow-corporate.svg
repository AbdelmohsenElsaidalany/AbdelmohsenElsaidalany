      <text x="18" y="63" fill="#EEF4F8" font-size="14" font-weight="700">Requirements</text>
      <text x="18" y="87" fill="#91A6B8" font-size="11">Rules · roles · criteria</text>
    </g>

    <g transform="translate(535 120)">
      <rect width="135" height="108" rx="16" fill="#13293C" stroke="#B69A65" stroke-opacity="0.9"/>
