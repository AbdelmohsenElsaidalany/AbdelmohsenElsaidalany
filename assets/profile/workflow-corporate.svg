      <circle cx="26" cy="27" r="15" fill="#18344A" stroke="#6F879C"/>
      <text x="26" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">07</text>
      <text x="18" y="61" fill="#EEF4F8" font-size="13" font-weight="700">Support &amp;</text>
      <text x="18" y="78" fill="#EEF4F8" font-size="13" font-weight="700">Improvement</text>
      <text x="18" y="97" fill="#91A6B8" font-size="10.5">Monitor · learn · evolve</text>
    </g>
