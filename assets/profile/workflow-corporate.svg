<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="EYAN workflow-first delivery process">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081723"/>
      <stop offset="1" stop-color="#10283C"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#6F879C"/>
      <stop offset="0.5" stop-color="#A5B7C6"/>
      <stop offset="1" stop-color="#D7B77A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#29465F" stroke-opacity="0.8"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="54" y="56" fill="#F7FAFC" font-size="30" font-weight="700">Workflow-First Delivery</text>
    <text x="54" y="84" fill="#8FA7BA" font-size="15">Business need → structured delivery → operational value</text>
  </g>

  <path id="mainFlow" d="M95 188 H1105" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(55 120)">
      <rect width="135" height="108" rx="16" fill="#0F2436" stroke="#3E5B73"/>
      <circle cx="26" cy="27" r="15" fill="#18344A" stroke="#6F879C"/>
