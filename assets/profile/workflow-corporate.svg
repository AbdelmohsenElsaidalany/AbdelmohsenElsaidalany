      <rect width="135" height="108" rx="16" fill="#0F2436" stroke="#3E5B73"/>
      <circle cx="26" cy="27" r="15" fill="#18344A" stroke="#6F879C"/>
      <text x="26" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">06</text>
      <text x="18" y="61" fill="#EEF4F8" font-size="13" font-weight="700">Verification &amp;</text>
      <text x="18" y="78" fill="#EEF4F8" font-size="13" font-weight="700">Deployment</text>
      <text x="18" y="97" fill="#91A6B8" font-size="10.5">Test · release · stabilize</text>
