      <text x="26" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">04</text>
      <text x="18" y="63" fill="#FFFFFF" font-size="14" font-weight="700">Solution Design</text>
      <text x="18" y="87" fill="#B8C6D1" font-size="11">UX · architecture · flow</text>
