    <text x="214" y="276" fill="#567086" font-size="13">•</text>
    <text x="238" y="276" fill="#DCE6ED" font-size="13" font-weight="600">PROCESS-DRIVEN</text>
    <text x="385" y="276" fill="#567086" font-size="13">•</text>
    <text x="409" y="276" fill="#DCE6ED" font-size="13" font-weight="600">SYSTEM-MINDED</text>
    <text x="550" y="276" fill="#567086" font-size="13">•</text>
    <text x="574" y="276" fill="#DCE6ED" font-size="13" font-weight="600">DELIVERY-FOCUSED</text>
