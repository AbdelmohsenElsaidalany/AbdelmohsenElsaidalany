  <circle r="5" fill="#E2C78F" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M95 188 H1105"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
